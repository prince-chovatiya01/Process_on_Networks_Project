[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spm-networks"
version = "0.1.0"
description = "SC452 Group 5: Does Aggregation Lie? Epidemic Thresholds on Temporal vs. Static Contact Networks"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tirth Gandhi", email = "202301016@daiict.ac.in" },
    { name = "Prince Chovatiya", email = "202301067@daiict.ac.in" },
    { name = "Nakul Patel", email = "202301261@daiict.ac.in" },
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "pytest>=7.4",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.65"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests requiring real datasets or external network calls",
    "smoke: quick end-to-end smoke tests"
]
